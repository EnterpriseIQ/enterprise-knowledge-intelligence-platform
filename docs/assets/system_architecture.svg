<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <style>
      .text-title { font-family: 'Inter', system-ui, sans-serif; font-size: 24px; font-weight: 700; fill: #F8FAFC; }
      .text-subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #94A3B8; }
      .text-box { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #F8FAFC; text-anchor: middle; }
      .box { fill: url(#box-grad); stroke: #475569; stroke-width: 1.5; rx: 8; }
      .line { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 4; }
      .line-solid { fill: none; stroke: #3B82F6; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <text x="400" y="50" class="text-title" text-anchor="middle">EnterpriseIQ System Architecture</text>
  <text x="400" y="75" class="text-subtitle" text-anchor="middle">Secure, Offline-First Agentic RAG Platform</text>

  <!-- Ingestion -->
  <rect x="50" y="120" width="200" height="300" class="box" fill-opacity="0.5"/>
  <text x="150" y="145" class="text-subtitle" text-anchor="middle">1. Ingestion Pipeline</text>

  <rect x="70" y="170" width="160" height="40" class="box" />
  <text x="150" y="195" class="text-box">Data Sources (PDF, SQL)</text>

  <rect x="70" y="240" width="160" height="40" class="box" />
  <text x="150" y="265" class="text-box">Semantic Chunker</text>

  <rect x="70" y="310" width="160" height="40" class="box" stroke="url(#accent)"/>
  <text x="150" y="335" class="text-box">Embedder (MiniLM)</text>

  <path d="M 150 210 L 150 240" class="line-solid" />
  <path d="M 150 280 L 150 310" class="line-solid" />

  <!-- Storage -->
  <rect x="300" y="120" width="200" height="300" class="box" fill-opacity="0.5"/>
  <text x="400" y="145" class="text-subtitle" text-anchor="middle">2. Storage Layer</text>

  <rect x="320" y="200" width="160" height="60" class="box" stroke="url(#accent)"/>
  <text x="400" y="235" class="text-box">ChromaDB (Dense)</text>

  <rect x="320" y="290" width="160" height="60" class="box" />
  <text x="400" y="325" class="text-box">BM25 (Sparse)</text>

  <path d="M 230 330 L 320 230" class="line-solid" />
  <path d="M 230 260 L 320 320" class="line-solid" />

  <!-- Retrieval & Gen -->
  <rect x="550" y="120" width="200" height="300" class="box" fill-opacity="0.5"/>
  <text x="650" y="145" class="text-subtitle" text-anchor="middle">3. Agentic RAG</text>

  <rect x="570" y="170" width="160" height="40" class="box" stroke="#EF4444" />
  <text x="650" y="195" class="text-box">Query Router & RBAC</text>

  <rect x="570" y="240" width="160" height="40" class="box" stroke="url(#accent)" />
  <text x="650" y="265" class="text-box">Hybrid Fusion Engine</text>

  <rect x="570" y="310" width="160" height="40" class="box" stroke="#10B981" />
  <text x="650" y="335" class="text-box">Extractive Generator</text>

  <path d="M 480 230 L 570 260" class="line-solid" />
  <path d="M 480 320 L 570 260" class="line-solid" />

  <path d="M 650 210 L 650 240" class="line-solid" />
  <path d="M 650 280 L 650 310" class="line-solid" />

  <!-- Out -->
  <rect x="570" y="440" width="160" height="40" rx="20" fill="url(#accent)" />
  <text x="650" y="465" class="text-box">Grounded Answer</text>
  <path d="M 650 350 L 650 440" class="line-solid" />
</svg>
